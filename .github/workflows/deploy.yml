name: Déploiement OVH

# Se déclenche à chaque modification poussée sur la branche du site,
# ou manuellement depuis l'onglet « Actions » de GitHub.
on:
  push:
    branches:
      - claude/website-creation-of13vb
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Préparer le dossier à envoyer (sans fichiers techniques)
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_deploy' \
            --exclude='README.md' \
            --exclude='images/simplecommerce' \
            ./ _deploy/
          # Anti-cache : remplace __BUILD__ par le hash du commit (force le rechargement)
          find _deploy -maxdepth 1 -name '*.html' -exec sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" {} +

      - name: Envoyer sur OVH (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ftp.cluster131.hosting.ovh.net
          username: coumaoq
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          port: 22
          local_path: './_deploy/*'
          remote_path: '/home/coumaoq/ougot'
          sftp_only: true
